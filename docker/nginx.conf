log_format staff '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

map "$status:$upstream_status" $staff_loggable {
    "404:" 0;
    default 1;
}

server {
    server_name amichiamoci;
    listen 8080 default_server;
    root /amichiamoci;
    # Classify URLs before try_files or FastCGI. Serve dotfiles and scanner paths as 404s.
    if ($uri ~* "(^|/)\\.|\\.(php[0-9]*|phtml|phar)([./]|$)") {
        return 404;
    }

    if ($uri ~* "(^|/)(wp-[^/]*|wordpress|xmlrpc\\.php|phpmyadmin|pma|cpanel|webmail|whm|plesk|panel|adminer|phpinfo)([./]|$)") {
        return 404;
    }

    location ~ ^/(css|js|images)/ {
        rewrite ^ /Public$uri last;
    }

    location ~ ^/(Public|docs)/ {
        try_files $uri $uri/ =404;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;
        gzip_vary on;

        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
        }
    }

    location / {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php-amichiamoci.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    client_max_body_size 256M;

    error_log /amichiamoci/data/log/nginx/error.log;
    error_log /dev/stderr;
    access_log /amichiamoci/data/log/nginx/access.log staff if=$staff_loggable;
}
