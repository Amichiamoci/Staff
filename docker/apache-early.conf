# Include in the portal VirtualHost to reject scanner paths before directory lookup.
RewriteEngine On
ErrorDocument 404 default

RewriteCond %{ENV:REDIRECT_STATUS} !^$
RewriteRule ^/index\.php$ - [L]
RewriteRule "(^|/)\.|\.(php[0-9]*|phtml|phar)([./]|$)" - [E=staff_rejected:1,R=404,L,NC]
RewriteRule "(^|/)(wp-[^/]*|wordpress|xmlrpc\.php|phpmyadmin|pma|cpanel|webmail|whm|plesk|panel|adminer|phpinfo)([./]|$)" - [E=staff_rejected:1,R=404,L,NC]
