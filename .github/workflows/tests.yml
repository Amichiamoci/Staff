name: Tests (Docker)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    services:
      mariadb:
        image: mariadb:12
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: fixture
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the Docker test image
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: docker build --build-arg "PHP_VERSION=$PHP_VERSION" --target test --tag staff-tests .

      - name: Run PHP checks
        env:
          DB_PORT: ${{ job.services.mariadb.ports['3306'] }}
        run: docker run --rm --network host staff-tests "$DB_PORT"
