name: Create GitHub release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version (for example 1.2.3 or v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version and tags
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a stable version such as 1.2.3 or v1.2.3.'
            exit 1
          fi
          version="${VERSION#v}"
          for tag in "$version" "v$version"; do
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi
          done
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    uses: ./.github/workflows/tests.yml

  release:
    name: Publish tested commit
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
