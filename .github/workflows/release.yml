name: Create GitHub release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version (for example 1.2.3 or v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version and tags
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a stable version such as 1.2.3 or v1.2.3.'
            exit 1
          fi
          version="${VERSION#v}"
          for tag in "$version" "v$version"; do
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi
          done
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    uses: ./.github/workflows/tests.yml

  release:
    name: Publish versioned release
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, gd, mbstring, mysqli
          tools: composer:v2
          coverage: none

      - name: Stamp release version
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          composer config version "$RELEASE_TAG"
          composer update --lock --no-install --no-interaction --no-audit
          composer validate --no-check-publish
          git add composer.json composer.lock
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "Release $RELEASE_TAG"
          fi

      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh auth setup-git
          git push origin "HEAD:refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
