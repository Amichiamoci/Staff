on:
  push:
    branches:
      - main

name: FTP deploy to server
jobs:
  ftp-deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    steps:

      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: Setup Doxygen
        run: sed -i 's/^OUTPUT_DIRECTORY[[:space:]]*=[[:space:]]*docs$/OUTPUT_DIRECTORY = docs_tmp/' ./Doxyfile

      - name: Generate Doxygen Documentation
        uses: mattnotmitt/doxygen-action@1.12.0

      - name: Rename output folder
        run: cp -R ./docs_tmp/html ./docs

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, gd, mbstring, mysqli
          tools: composer:v2
          coverage: none
        env:
          update: true

      - name: Cache php libraries
        uses: actions/cache@v6
        id: cache
        with:
          path: ./vendor/
          key: ${{ runner.os }}-php84-vendor-${{ hashFiles('./composer.lock') }}

      - name: Install php Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer install --no-interaction --no-progress --optimize-autoloader --no-dev

      - name: Prepare deployment configuration
        env:
          MYSQL_HOST: ${{ secrets.DB_ADDRESS }}
          MYSQL_USER: ${{ secrets.DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DB: ${{ secrets.DB_MASTER_DATABASE }}
          RECAPTCHA_PUBLIC_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET }}
          MAIL_OUTPUT_ADDRESS: ${{ secrets.SMTP_USER }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_OPEN_SIGNING_KEY: ${{ secrets.MAIL_OPEN_SIGNING_KEY }}
          CODICE_COMITATO_CSI: ${{ secrets.CODICE_COMITATO_CSI }}
          CODICE_SOCIETA_CSI: ${{ secrets.CODICE_SOCIETA_CSI }}
        run: |
          umask 077
          python3 - <<'PYTHON'
          import json
          import os

          keys = (
              "MYSQL_HOST", "MYSQL_USER", "MYSQL_PASSWORD", "MYSQL_DB",
              "RECAPTCHA_PUBLIC_KEY", "RECAPTCHA_SECRET_KEY", "MAIL_OUTPUT_ADDRESS",
              "SMTP_HOST", "SMTP_PORT", "SMTP_USER", "SMTP_PASSWORD", "MAIL_OPEN_SIGNING_KEY",
              "CODICE_COMITATO_CSI", "CODICE_SOCIETA_CSI",
          )
          values = {key: os.environ[key] for key in keys}
          values["DOMAIN"] = "amichiamoci.it"
          values["SESSION_COOKIE_SECURE"] = "1"
          values["ENABLE_API"] = "true"

          with open(".env", "w", encoding="utf-8") as env_file:
              for key, value in values.items():
                  encoded = json.dumps(value, ensure_ascii=False).replace("$", r"\$")
                  env_file.write(f"{key}={encoded}\n")
          PYTHON

      - name: Copy .htaccess
        run: cp ./docker/apache.htaccess ./.htaccess

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_ENDPOINT }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_FOLDER_BASE }}admin/
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/data/**
            **/tests/**
            **/docs_tmp/**
            *.md
            Dockerfile
            docker-compose.yml
            .dockerignore
            *.sh
            **/queries/**
            **/.vscode/**
            Doxyfile
