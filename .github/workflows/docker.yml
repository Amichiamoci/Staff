name: Publish Docker release images

on:
  release:
    types: [published]
  workflow_call:
    secrets:
      DOCKER_HUB_PASSWORD:
        required: true

permissions:
  contents: read

env:
  APP_NAME: staff
  DOCKER_USERNAME: amichiamoci

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  docker:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Change repository owner to lowercase
        id: repo_owner
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ github.repository_owner }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ steps.repo_owner.outputs.lowercase }}/${{ env.APP_NAME }}
            ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=nighly,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=Amichiamoci Staff
            org.opencontainers.image.description=Portale Staff per Amichiamoci
            org.opencontainers.image.vendor=Amichiamoci

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
